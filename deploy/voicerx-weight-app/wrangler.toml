name = "voicerx-weight-app"
compatibility_date = "2026-05-29"

# voicerx-weight-app is a static-assets Worker: it serves the installable
# Weight Diary PWA (public/index.html + manifest + service worker + icon).
# There is no server code. All patient entries live in the browser's
# localStorage on the patient's own device — nothing is uploaded.
[assets]
directory = "./public"
