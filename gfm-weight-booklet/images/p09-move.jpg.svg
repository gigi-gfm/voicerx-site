<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-label="A person out for a brisk walk on a sunny path">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebff"/><stop offset="1" stop-color="#fef0d8"/></linearGradient>
  </defs>
  <rect width="1600" height="600" fill="url(#sky)"/>
  <circle cx="1330" cy="150" r="80" fill="#fbbf24"/>
  <circle cx="1330" cy="150" r="110" fill="#fbbf24" opacity="0.25"/>
  <g fill="#ffffff" opacity="0.75"><ellipse cx="320" cy="140" rx="90" ry="34"/><ellipse cx="400" cy="120" rx="70" ry="30"/><ellipse cx="250" cy="120" rx="60" ry="26"/></g>
  <!-- hills -->
  <path d="M0 470 q300 -120 620 -40 q360 90 980 -10 l0 180 -1600 0 z" fill="#9ccf8f"/>
  <path d="M0 520 q400 -70 820 -10 q420 60 780 0 l0 90 -1600 0 z" fill="#76bd6b"/>
  <!-- path -->
  <path d="M620 600 q40 -120 220 -160 q200 -44 240 -130" fill="none" stroke="#e8c98a" stroke-width="60" stroke-linecap="round"/>
  <path d="M620 600 q40 -120 220 -160 q200 -44 240 -130" fill="none" stroke="#fff3d6" stroke-width="8" stroke-dasharray="2 40" stroke-linecap="round"/>
  <!-- trees -->
  <g transform="translate(180,430)"><rect x="-10" y="0" width="20" height="70" rx="6" fill="#7a5230"/><circle cx="0" cy="-20" r="56" fill="#3f9d4f"/></g>
  <g transform="translate(1440,430)"><rect x="-9" y="0" width="18" height="60" rx="6" fill="#7a5230"/><circle cx="0" cy="-16" r="46" fill="#57b85f"/></g>
  <!-- walking figure -->
  <g transform="translate(770,300)">
    <circle cx="0" cy="-110" r="40" fill="#e8b48a"/>
    <path d="M-30 -150 a40 40 0 0 1 60 0 q0 -52 -30 -52 q-30 0 -30 52z" fill="#3a4a5c"/>
    <rect x="-34" y="-78" width="68" height="120" rx="30" fill="#f97316"/>
    <!-- arms -->
    <path d="M-30 -52 q-46 16 -54 64" stroke="#e8b48a" stroke-width="22" fill="none" stroke-linecap="round"/>
    <path d="M30 -52 q44 -6 56 30" stroke="#e8b48a" stroke-width="22" fill="none" stroke-linecap="round"/>
    <!-- legs -->
    <path d="M-12 40 q-30 60 -70 80" stroke="#1e3a8a" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M14 40 q26 64 70 78" stroke="#1e40af" stroke-width="26" fill="none" stroke-linecap="round"/>
    <ellipse cx="-86" cy="126" rx="30" ry="14" fill="#ffffff"/>
    <ellipse cx="88" cy="122" rx="30" ry="14" fill="#ffffff"/>
  </g>
</svg>
