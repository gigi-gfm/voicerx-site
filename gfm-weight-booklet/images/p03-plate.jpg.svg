<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-label="A balanced plate: half vegetables, a quarter protein, a quarter smart carbs">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e9eef5"/></linearGradient>
    <radialGradient id="pl3" cx="50%" cy="44%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/></radialGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#bg3)"/>
  <circle cx="800" cy="350" r="300" fill="#dde4ee"/>
  <circle cx="800" cy="344" r="288" fill="url(#pl3)"/>
  <circle cx="800" cy="344" r="222" fill="none" stroke="#e2e8f0" stroke-width="6"/>
  <!-- divider hints -->
  <path d="M800 122 V566 M800 344 H1022" stroke="#e8edf4" stroke-width="6"/>
  <!-- LEFT HALF: vegetables -->
  <g fill="#3f9d4f"><circle cx="650" cy="270" r="34"/><circle cx="700" cy="248" r="28"/><circle cx="628" cy="320" r="26"/><circle cx="690" cy="312" r="30"/></g>
  <g fill="#57b85f"><circle cx="640" cy="430" r="30"/><circle cx="700" cy="420" r="26"/><circle cx="664" cy="392" r="22"/></g>
  <path d="M612 350 q-30 -60 8 -110" stroke="#2f7d3c" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g fill="#e1503a"><circle cx="700" cy="360" r="20"/><circle cx="660" cy="478" r="16"/></g>
  <ellipse cx="730" cy="300" rx="40" ry="20" fill="#f6a623" opacity=".85"/>
  <!-- UPPER RIGHT: protein (grilled) -->
  <g transform="rotate(-12 910 250)"><rect x="828" y="206" width="168" height="96" rx="22" fill="#d98a52"/><rect x="828" y="206" width="168" height="96" rx="22" fill="none" stroke="#b96f3c" stroke-width="6"/><path d="M846 226 h132 M846 252 h132 M846 278 h132" stroke="#8a5226" stroke-width="7" stroke-linecap="round" opacity=".7"/></g>
  <!-- LOWER RIGHT: smart carbs (grain) -->
  <g fill="#d9b771"><circle cx="880" cy="430" r="9"/><circle cx="906" cy="448" r="9"/><circle cx="934" cy="430" r="9"/><circle cx="892" cy="466" r="9"/><circle cx="922" cy="466" r="9"/><circle cx="864" cy="452" r="9"/><circle cx="950" cy="452" r="9"/><circle cx="908" cy="424" r="9"/><circle cx="876" cy="488" r="9"/><circle cx="936" cy="488" r="9"/></g>
  <!-- labels -->
  <g font-family="Poppins, Arial, sans-serif" font-weight="600" fill="#1e3a8a" font-size="22" text-anchor="middle">
    <text x="380" y="350">½ Vegetables</text>
    <text x="1240" y="250">¼ Protein</text>
    <text x="1240" y="470">¼ Smart carbs</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="3"><path d="M470 344 H560"/><path d="M1110 250 H1010"/><path d="M1150 460 H1010"/></g>
</svg>
