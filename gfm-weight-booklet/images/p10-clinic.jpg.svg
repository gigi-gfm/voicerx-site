<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-label="A friendly neighborhood family-medicine clinic (illustration)">
  <defs>
    <linearGradient id="sky10" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcebff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef2f7"/></linearGradient>
  </defs>
  <rect width="1600" height="800" fill="url(#sky10)"/>
  <circle cx="240" cy="160" r="70" fill="#fbbf24" opacity="0.85"/>
  <g fill="#ffffff" opacity="0.8"><ellipse cx="1200" cy="160" rx="90" ry="32"/><ellipse cx="1280" cy="140" rx="66" ry="28"/></g>
  <!-- ground -->
  <rect x="0" y="640" width="1600" height="160" fill="#9ccf8f"/>
  <rect x="0" y="690" width="1600" height="110" fill="#76bd6b"/>
  <!-- trees -->
  <g transform="translate(180,640)"><rect x="-14" y="-10" width="28" height="90" rx="8" fill="#7a5230"/><circle cx="0" cy="-50" r="80" fill="#3f9d4f"/></g>
  <g transform="translate(1430,640)"><rect x="-12" y="-10" width="24" height="80" rx="8" fill="#7a5230"/><circle cx="0" cy="-44" r="66" fill="#57b85f"/></g>
  <!-- building -->
  <rect x="470" y="330" width="660" height="320" rx="10" fill="url(#wall)"/>
  <rect x="470" y="330" width="660" height="320" rx="10" fill="none" stroke="#e2e8f0" stroke-width="4"/>
  <!-- roof -->
  <path d="M440 330 L800 220 L1160 330 Z" fill="#1e3a8a"/>
  <path d="M440 330 L1160 330" stroke="#16306f" stroke-width="6"/>
  <!-- medical cross sign -->
  <g transform="translate(800,300)"><circle r="46" fill="#f97316"/><rect x="-10" y="-26" width="20" height="52" rx="5" fill="#fff"/><rect x="-26" y="-10" width="52" height="20" rx="5" fill="#fff"/></g>
  <!-- door -->
  <rect x="730" y="470" width="140" height="180" rx="8" fill="#1e40af"/>
  <rect x="744" y="486" width="112" height="150" rx="6" fill="#9cc0ff" opacity="0.8"/>
  <line x1="800" y1="486" x2="800" y2="636" stroke="#1e40af" stroke-width="6"/>
  <!-- windows -->
  <g fill="#cfe0ff" stroke="#1e40af" stroke-width="6">
    <rect x="540" y="400" width="120" height="110" rx="8"/><rect x="940" y="400" width="120" height="110" rx="8"/>
  </g>
  <g stroke="#1e40af" stroke-width="5"><path d="M600 400 V510 M540 455 H660"/><path d="M1000 400 V510 M940 455 H1060"/></g>
  <!-- GFM sign -->
  <rect x="660" y="372" width="280" height="48" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="800" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="30" fill="#1e3a8a">Garcia Family Medicine</text>
  <!-- path -->
  <path d="M800 650 L800 800" stroke="#e8c98a" stroke-width="120"/>
  <path d="M800 650 L800 800" stroke="#fff3d6" stroke-width="8" stroke-dasharray="2 38"/>
</svg>
