<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-label="A care-team member and a patient talking through a plan together">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf1fb"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  </defs>
  <rect width="1200" height="1400" fill="url(#bg2)"/>
  <circle cx="600" cy="430" r="250" fill="#f97316" opacity="0.08"/>
  <!-- heart between them -->
  <path d="M600 300 c-30 -42 -96 -22 -96 26 c0 40 56 70 96 104 c40 -34 96 -64 96 -104 c0 -48 -66 -68 -96 -26 z" fill="#fb923c" opacity="0.9"/>
  <!-- floor -->
  <rect x="0" y="1180" width="1200" height="220" fill="#eef2f7"/>
  <!-- plant -->
  <g transform="translate(150,1180)"><rect x="-46" y="0" width="92" height="80" rx="12" fill="#e07a4e"/><path d="M0 0 C-60 -40 -70 -120 -20 -150 M0 0 C20 -60 80 -80 110 -50 M0 0 C-10 -70 30 -130 70 -130" stroke="#3f9d4f" stroke-width="16" fill="none" stroke-linecap="round"/></g>
  <!-- clinician (left) -->
  <g>
    <rect x="360" y="820" width="240" height="370" rx="110" fill="#1e3a8a"/>
    <rect x="360" y="820" width="240" height="200" fill="#1e3a8a"/>
    <path d="M372 880 q108 70 216 0 l0 300 -216 0 z" fill="#ffffff" opacity="0.92"/>
    <circle cx="480" cy="730" r="92" fill="#f2c8a0"/>
    <path d="M388 720 a92 92 0 0 1 184 0 q0 -120 -92 -120 q-92 0 -92 120 z" fill="#3a4a5c"/>
    <!-- stethoscope -->
    <path d="M470 900 q-60 70 -10 150 q40 40 90 10" stroke="#cdd7e6" stroke-width="12" fill="none" stroke-linecap="round"/>
    <circle cx="556" cy="1052" r="20" fill="#94a3b8"/>
  </g>
  <!-- patient (right) -->
  <g>
    <rect x="620" y="860" width="230" height="330" rx="105" fill="#f97316"/>
    <rect x="620" y="860" width="230" height="180" fill="#f97316"/>
    <circle cx="735" cy="772" r="88" fill="#e8b48a"/>
    <path d="M647 772 a88 88 0 0 1 176 0 q0 -110 -88 -110 q-88 0 -88 110 z" fill="#5b4636"/>
  </g>
</svg>
